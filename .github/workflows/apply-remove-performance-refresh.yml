name: Apply remove performance refresh

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - scripts/remove_performance_refresh.py
      - .github/workflows/apply-remove-performance-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove refresh button
        run: python scripts/remove_performance_refresh.py
      - name: Clean temporary files
        run: |
          rm scripts/remove_performance_refresh.py
          rm .github/workflows/apply-remove-performance-refresh.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Quitar Actualizar de Rendimiento"
          git push origin HEAD:react-vite-migration
