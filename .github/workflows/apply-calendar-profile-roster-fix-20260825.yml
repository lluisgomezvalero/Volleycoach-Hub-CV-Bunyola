name: Apply calendar profile roster fixes

on:
  push:
    branches:
      - fix/calendario-perfil-dorsal-20260825
    paths:
      - '.github/workflows/apply-calendar-profile-roster-fix-20260825.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire new UX fix and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path('supabase-config.js')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace(
              "window.VOLLEY_ASSET_VERSION = '20260825stats4';",
              "window.VOLLEY_ASSET_VERSION = '20260825ux1';"
          )
          needle = "  'calendar-add-button-polish-20260820.js?v=20260820tablet1',"
          addition = "  'calendar-profile-roster-fixes-20260825.js?v=20260825ux1',"
          if addition not in config:
              assert needle in config, 'Calendar loader anchor not found'
              config = config.replace(needle, needle + '\n' + addition)
          config_path.write_text(config, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old = 'supabase-config.js?v=20260825stats4'
          new = 'supabase-config.js?v=20260825ux1'
          assert old in index or new in index, 'Supabase config cache key not found'
          index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit wiring and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git rm .github/workflows/apply-calendar-profile-roster-fix-20260825.yml
          git commit -m "Wire calendar profile and roster fixes"
          git push
