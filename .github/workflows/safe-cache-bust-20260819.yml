name: Force fresh wellness modal fix

on:
  push:
    paths:
      - '.github/workflows/safe-cache-bust-20260819.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh wellness modal fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          s = cfg.read_text()
          s = s.replace("window.VOLLEY_ASSET_VERSION = '20260824wellness2';", "window.VOLLEY_ASSET_VERSION = '20260824wellness3';", 1)
          s = s.replace("wellness-individual-modal-polish-20260822.js?v=20260822a", "wellness-individual-modal-polish-20260822.js?v=20260824freeze1", 1)
          cfg.write_text(s)

          index = Path('index.html')
          i = index.read_text()
          i = re.sub(r'supabase-config\.js\?v=[A-Za-z0-9._-]+', 'supabase-config.js?v=20260824wellness3', i, count=1)
          index.write_text(i)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache update needed"
          else
            git commit -m "Force fresh wellness modal fix"
            git push
          fi