name: Safe cache bust after recovery

on:
  push:
    paths:
      - '.github/workflows/safe-cache-bust-20260819.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load player stats card polish
        run: |
          BASE=$(git rev-parse HEAD^)
          sed -i 's/supabase-config.js?v=20260823safe66/supabase-config.js?v=20260824safe67/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache key change needed"
          else
            git commit -m "Load player stats card polish"
            git push
          fi

          git show "$BASE":.github/workflows/safe-cache-bust-20260819.yml > .github/workflows/safe-cache-bust-20260819.yml
          git add .github/workflows/safe-cache-bust-20260819.yml
          if git diff --cached --quiet; then
            echo "Workflow already restored"
          else
            git commit -m "Restore safe cache workflow"
            git push
          fi
