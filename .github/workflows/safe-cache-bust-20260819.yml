name: Safe cache bust after recovery

on:
  push:
    paths:
      - '.github/workflows/safe-cache-bust-20260819.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore performance module render
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text()
          old = '''  } else if (moduleName === "goals") {
    renderWeeklyGoals();
  } else if (moduleName === "planning") {
    renderPlanningViewer();
  }
'''
          new = '''  } else if (moduleName === "goals") {
    renderWeeklyGoals();
  } else if (moduleName === "fitness") {
    renderPerformanceModule();
  } else if (moduleName === "planning") {
    renderPlanningViewer();
  }
'''
          if old not in s:
              raise SystemExit('openModule anchor not found')
          app.write_text(s.replace(old, new, 1))

          index = Path('index.html')
          s = index.read_text()
          old = 'app.js?v=20260816q'
          new = 'app.js?v=20260823performance1'
          if old not in s:
              raise SystemExit('app.js cache anchor not found')
          index.write_text(s.replace(old, new, 1))
          PY

          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/safe-cache-bust-20260819.yml
          git add app.js index.html .github/workflows/safe-cache-bust-20260819.yml
          git commit -m "Render performance module when opened"
          git push
