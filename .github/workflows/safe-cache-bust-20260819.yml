name: Load player individual stats priority

on:
  push:
    paths:
      - '.github/workflows/safe-cache-bust-20260819.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load individual priority module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          s = cfg.read_text()
          s = re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260825stats2';", s, count=1)
          anchor = "  'match-statistics-optional-v2-20260825.js?v=20260825stats1',"
          addition = "  'match-statistics-player-individual-priority-20260825.js?v=20260825stats2',"
          if addition not in s:
              s = s.replace(anchor, anchor + "\n" + addition, 1)
          cfg.write_text(s)

          index = Path('index.html')
          i = index.read_text()
          i = re.sub(r'supabase-config\.js\?v=[A-Za-z0-9._-]+', 'supabase-config.js?v=20260825stats2', i, count=1)
          index.write_text(i)
          PY

          node --check match-statistics-player-individual-priority-20260825.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No player stats cache update needed"
          else
            git commit -m "Load player individual stats priority"
            git push
          fi
