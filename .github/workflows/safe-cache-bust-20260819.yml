name: Load authoritative wellness cleanup

on:
  push:
    paths:
      - '.github/workflows/safe-cache-bust-20260819.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load authoritative wellness cleanup
        run: |
          BASE=$(git rev-parse HEAD^1)
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          s = cfg.read_text()
          s = s.replace("window.VOLLEY_ASSET_VERSION = '20260824c';", "window.VOLLEY_ASSET_VERSION = '20260824wellness1';", 1)
          anchor = "  'app-corrections-20260809.js?v=20260822b',"
          addition = "  'wellness-authoritative-clean-20260824.js?v=20260824a',"
          if addition not in s:
              s = s.replace(anchor, anchor + "\n" + addition, 1)
          cfg.write_text(s)

          index = Path('index.html')
          i = index.read_text()
          i = re.sub(r'supabase-config\.js\?v=[A-Za-z0-9._-]+', 'supabase-config.js?v=20260824wellness1', i, count=1)
          index.write_text(i)
          PY

          node --check wellness-authoritative-clean-20260824.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No wellness cache update needed"
          else
            git commit -m "Load authoritative wellness cleanup"
            git push
          fi

          git show "$BASE":.github/workflows/safe-cache-bust-20260819.yml > .github/workflows/safe-cache-bust-20260819.yml
          git add .github/workflows/safe-cache-bust-20260819.yml
          if git diff --cached --quiet; then
            echo "Workflow already restored"
          else
            git commit -m "Restore safe cache workflow"
            git push
          fi
