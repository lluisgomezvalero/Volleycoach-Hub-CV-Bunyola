name: Apply QA polish

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - .github/workflows/apply-qa-polish-20260830.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Aplicar pulido
        run: python3 .github/scripts/qa_polish_20260830.py
      - name: Limpiar parche temporal y guardar
        shell: bash
        run: |
          rm .github/scripts/qa_polish_20260830.py
          rm .github/workflows/apply-qa-polish-20260830.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pulir fluidez de perfil y sesión"
          git push origin HEAD:react-vite-migration
