name: Fix reopened RPE comment UX 20260903

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/fix-rpe-comment-ux-20260903.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0

      - name: Patch reopened RPE comment flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('react-migration/src/pages/TrainingPageProfessional.jsx')
          text = p.read_text()

          old = """  const [commentEditing, setCommentEditing] = useState(false);\n  const [assessment, setAssessment] = useState('');"""
          new = """  const [commentEditing, setCommentEditing] = useState(false);\n  const commentPanelRef = useRef(null);\n  const [assessment, setAssessment] = useState('');"""
          if old not in text:
              raise SystemExit('comment state marker not found')
          text = text.replace(old, new, 1)

          old = """  async function savePlayerComment() {\n    if (!isPlayer || !identity?.player?.id || !completed) return;"""
          new = """  function goToPlayerComment() {\n    const panel = commentPanelRef.current;\n    if (!panel) return;\n    panel.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    if (!ownPlayerComment) {\n      window.setTimeout(() => panel.querySelector('textarea')?.focus({ preventScroll: true }), 350);\n    }\n  }\n\n  async function savePlayerComment() {\n    if (!isPlayer || !identity?.player?.id || !completed) return;"""
          if old not in text:
              raise SystemExit('save comment marker not found')
          text = text.replace(old, new, 1)

          old = """            {(isStaff && coachRpe) || (isPlayer && ownPlayerRpe) ? (\n              <div className=\"pro-rpe-locked\">\n                <Check size={18} />\n                <span>\n                  <strong>{isStaff ? 'RPE previsto registrado' : 'RPE registrado'}</strong>\n                  <small>{isStaff ? 'Este valor queda cerrado y ya no puede modificarse.' : `Tu respuesta (${Math.round(Number(ownPlayerRpe?.score || 0))}/10) ha quedado guardada y cerrada.`}</small>\n                </span>\n              </div>\n            ) : isStaff && rpeExpired ? ("""
          new = """            {(isStaff && coachRpe) || (isPlayer && ownPlayerRpe) ? (\n              <>\n                <div className=\"pro-rpe-locked\">\n                  <Check size={18} />\n                  <span>\n                    <strong>{isStaff ? 'RPE previsto registrado' : 'RPE registrado'}</strong>\n                    <small>{isStaff ? 'Este valor queda cerrado y ya no puede modificarse.' : `Tu respuesta (${Math.round(Number(ownPlayerRpe?.score || 0))}/10) ha quedado guardada y cerrada.`}</small>\n                  </span>\n                </div>\n                {isPlayer ? (\n                  <button className=\"pro-outline-action pro-rpe-comment-action\" type=\"button\" onClick={goToPlayerComment}>\n                    <MessageSquare size={17} /> {ownPlayerComment ? 'Ver mi comentario' : 'Añadir comentario (opcional)'}\n                  </button>\n                ) : null}\n              </>\n            ) : isStaff && rpeExpired ? ("""
          if old not in text:
              raise SystemExit('RPE locked marker not found')
          text = text.replace(old, new, 1)

          old = """      {completed && isPlayer ? (\n        <article className=\"pro-session-panel tone-violet\">"""
          new = """      {completed && isPlayer ? (\n        <article ref={commentPanelRef} className=\"pro-session-panel tone-violet\">"""
          if old not in text:
              raise SystemExit('player comment panel marker not found')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-migration/package-lock.json

      - name: Build
        working-directory: react-migration
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit patch
        run: |
          git restore react-migration/package-lock.json 2>/dev/null || true
          git restore react-migration/public 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/TrainingPageProfessional.jsx
          git commit -m "Make reopened RPE comment flow explicit"
          git push origin HEAD:react-vite-migration
