name: Apply legacy ACWR reference

on:
  push:
    branches: [react-vite-migration]
    paths:
      - '.github/workflows/apply-legacy-acwr-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
      - name: Apply patch
        run: python scripts/apply_legacy_acwr_reference.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/WellnessPage.jsx react-migration/src/pages/WellnessPage.css
          git diff --cached --quiet && exit 0
          git commit -m "Restaurar referencia ACWR de 35 días"
          git push origin react-vite-migration
