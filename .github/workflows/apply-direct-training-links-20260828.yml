name: Apply direct training links 20260828

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/apply-direct-training-links-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_direct_training_links_20260828.py
      - name: Cleanup temporary files
        run: rm -f scripts/patch_direct_training_links_20260828.py .github/workflows/apply-direct-training-links-20260828.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Abrir sesión y lista directamente desde Inicio"
          git push origin HEAD:react-vite-migration
