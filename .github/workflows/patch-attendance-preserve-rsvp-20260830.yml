name: Patch attendance preserve RSVP 20260830

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/patch-attendance-preserve-rsvp-20260830.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Preserve player RSVP when staff validates attendance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('react-migration/src/pages/TrainingPageProfessional.jsx')
          text = path.read_text()
          old = "return { event_id: rollCall.event.id, player_id: player.id, official_status: status, effective_minutes: effectiveMinutes, validated_by: status ? identity.profile.id : null, validated_at: status ? nowIso : null, updated_at: nowIso };"
          new = "return { event_id: rollCall.event.id, player_id: player.id, player_response: rollCall.responses[player.id] || null, official_status: status, effective_minutes: effectiveMinutes, validated_by: status ? identity.profile.id : null, validated_at: status ? nowIso : null, updated_at: nowIso };"
          if old not in text:
              raise SystemExit('Attendance roll-call row not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/TrainingPageProfessional.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Preservar confirmación al validar asistencia"
          git push origin HEAD:react-vite-migration
