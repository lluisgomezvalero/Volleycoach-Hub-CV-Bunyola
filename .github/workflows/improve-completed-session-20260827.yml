name: Improve completed session UI

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/improve-completed-session-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0

      - name: Improve completed session layout
        run: |
          python - <<'PY'
          from pathlib import Path

          jsx_path = Path('react-migration/src/pages/TrainingPageProfessional.jsx')
          css_path = Path('react-migration/src/pages/TrainingPageProfessional.css')
          jsx = jsx_path.read_text()
          css = css_path.read_text()

          jsx = jsx.replace("const [rpeValue, setRpeValue] = useState(4);", "const [rpeValue, setRpeValue] = useState(5);", 1)

          anchor = "  const coachRpe = rpeRows.find((row) => row.source === 'coach' && row.coach_profile_id === identity?.profile?.id);\n"
          insert = anchor + "  const coachScore = coachRpe ? Number(coachRpe.score) : null;\n  const rpeGap = coachScore !== null && playerMean !== null ? coachScore - playerMean : null;\n"
          if "const rpeGap =" not in jsx:
              jsx = jsx.replace(anchor, insert, 1)

          jsx = jsx.replace('<div className="pro-panel-title"><Activity size={19} /><span><small>Percepción del esfuerzo</small><strong>RPE de la sesión</strong></span></div>', '<div className="pro-panel-title pro-rpe-title"><Activity size={19} /><span><small>Percepción del esfuerzo</small><strong>Percepción del esfuerzo</strong></span></div>', 1)

          old = '''              <div className="pro-rpe-comparison">\n                <div><span>Entrenador</span><strong>{coachRpe ? Number(coachRpe.score).toFixed(0) : '—'}</strong><small>{coachRpe ? 'RPE registrado' : 'Sin responder'}</small></div>\n                <div><span>Media jugadoras</span><strong>{playerMean === null ? '—' : playerMean.toFixed(1)}</strong><small>{playerRpes.length} respuesta{playerRpes.length === 1 ? '' : 's'}</small></div>\n              </div>'''
          new = '''              <>\n                <div className="pro-rpe-comparison">\n                  <div className="pro-rpe-summary-card coach">\n                    <span>Entrenador</span>\n                    <strong>{coachScore === null ? '—' : coachScore.toFixed(0)}</strong>\n                    <div className="pro-rpe-meter" aria-hidden="true"><i style={{ width: `${coachScore === null ? 0 : Math.max(0, Math.min(100, coachScore * 10))}%` }} /></div>\n                    <small>{coachScore === null ? 'Sin responder' : 'RPE registrado'}</small>\n                  </div>\n                  <div className="pro-rpe-summary-card players">\n                    <span>Media jugadoras</span>\n                    <strong>{playerMean === null ? '—' : playerMean.toFixed(1)}</strong>\n                    <div className="pro-rpe-meter" aria-hidden="true"><i style={{ width: `${playerMean === null ? 0 : Math.max(0, Math.min(100, playerMean * 10))}%` }} /></div>\n                    <small>{playerRpes.length} respuesta{playerRpes.length === 1 ? '' : 's'}</small>\n                  </div>\n                </div>\n                <div className={`pro-rpe-insight ${rpeGap === null ? 'pending' : Math.abs(rpeGap) <= 1 ? 'aligned' : 'different'}`}>\n                  {rpeGap === null\n                    ? 'Faltan valoraciones para comparar.'\n                    : Math.abs(rpeGap) <= 1\n                      ? `Percepción bastante alineada · diferencia ${Math.abs(rpeGap).toFixed(1)}`\n                      : `Diferencia de percepción de ${Math.abs(rpeGap).toFixed(1)} puntos.`}\n                </div>\n              </>'''
          if old in jsx:
              jsx = jsx.replace(old, new, 1)

          jsx = jsx.replace("isStaff ? 'Guardar RPE entrenador' : 'Guardar mi RPE'", "isStaff ? 'Guardar RPE' : 'Guardar mi RPE'", 1)
          jsx = jsx.replace('<article className="pro-session-panel tone-slate">\n            <div className="pro-panel-title"><NotebookPen', '<article className="pro-session-panel tone-slate pro-coach-review-panel">\n            <div className="pro-panel-title"><NotebookPen', 1)
          jsx = jsx.replace('<article className="pro-session-panel tone-violet">\n            <div className="pro-panel-title"><MessageSquare', '<article className="pro-session-panel tone-violet pro-feedback-panel">\n            <div className="pro-panel-title"><MessageSquare', 1)

          marker = '/* completed-session-polish-20260827 */'
          if marker not in css:
              css += r'''

/* completed-session-polish-20260827 */
.pro-rpe-panel{
  gap:16px;
  border-color:#e3e6eb;
  box-shadow:0 10px 28px rgba(15,23,42,.055);
}
.pro-rpe-title>svg{
  width:24px;
  height:24px;
  color:#8d98a8;
}
.pro-rpe-title strong{
  font-size:1.05rem;
  color:#243047;
}
.pro-rpe-comparison{
  gap:12px;
}
.pro-rpe-summary-card{
  min-width:0;
  padding:15px 16px!important;
  border:1px solid #e3e7ed!important;
  border-radius:16px!important;
  background:linear-gradient(180deg,#fbfcfd 0%,#f7f9fb 100%)!important;
  display:grid!important;
  grid-template-columns:1fr auto!important;
  grid-template-rows:auto auto auto!important;
  gap:7px 10px!important;
}
.pro-rpe-summary-card>span{
  align-self:end;
  color:#7d8898;
  font-size:.72rem;
  font-weight:750;
}
.pro-rpe-summary-card>strong{
  grid-column:2!important;
  grid-row:1/3!important;
  align-self:center;
  font-size:1.65rem!important;
  letter-spacing:-.035em;
  color:#182230!important;
}
.pro-rpe-summary-card>small{
  grid-column:1/-1;
  color:#8792a3;
  font-size:.67rem!important;
}
.pro-rpe-meter{
  grid-column:1;
  height:8px;
  border-radius:999px;
  background:#e5eaf0;
  overflow:hidden;
}
.pro-rpe-meter>i{
  display:block;
  height:100%;
  border-radius:inherit;
  background:#172033;
  transition:width .2s ease;
}
.pro-rpe-summary-card.players .pro-rpe-meter>i{
  background:#16b77a;
}
.pro-rpe-insight{
  padding:11px 13px;
  border:1px solid #e1e5eb;
  border-radius:13px;
  background:#f8fafc;
  color:#647084;
  font-size:.73rem;
  font-weight:780;
}
.pro-rpe-insight.aligned{
  border-color:#cfe8da;
  background:#f0faf5;
  color:#267052;
}
.pro-rpe-insight.different{
  border-color:#f0d7b4;
  background:#fff8ed;
  color:#8a5a15;
}
.pro-rpe-value-row{
  gap:14px;
  padding-top:2px;
}
.pro-rpe-value-row strong{
  font-size:1.8rem;
  letter-spacing:-.04em;
  color:#172033;
}
.pro-rpe-value-row span{
  font-size:.88rem;
  color:#69778c;
}
.pro-rpe-scale input{
  height:32px;
}
.pro-rpe-ticks{
  font-size:.68rem;
  font-weight:750;
}
.pro-rpe-panel>.pro-primary-action{
  min-height:50px;
  border-radius:14px;
  font-size:.9rem;
  box-shadow:0 8px 20px rgba(226,139,7,.22);
}
.pro-coach-review-panel,
.pro-feedback-panel{
  box-shadow:0 10px 28px rgba(15,23,42,.045);
}
.pro-coach-review-panel .pro-field{
  gap:8px;
}
.pro-coach-review-panel .pro-field>span{
  font-size:.75rem;
  color:#596579;
}
.pro-coach-review-panel textarea{
  min-height:118px;
  border-radius:15px;
  padding:14px 15px;
  background:#fbfcfd;
  line-height:1.5;
}
.pro-coach-review-panel .pro-secondary-action{
  width:100%;
  min-height:48px;
  border-radius:13px;
}
.pro-feedback-panel .pro-player-comments>div{
  padding:13px;
  border-radius:14px;
  background:#fbfcfd;
}
@media(max-width:820px){
  .pro-session-page{
    gap:15px;
  }
  .pro-session-section-head{
    margin-top:5px;
  }
  .pro-rpe-panel{
    padding:16px;
    border-radius:19px;
  }
  .pro-rpe-comparison{
    grid-template-columns:1fr 1fr;
  }
  .pro-rpe-summary-card{
    padding:13px 12px!important;
  }
  .pro-rpe-summary-card>strong{
    font-size:1.45rem!important;
  }
  .pro-coach-review-panel,
  .pro-feedback-panel{
    border-radius:19px;
  }
}
@media(max-width:430px){
  .pro-rpe-comparison{
    gap:9px;
  }
  .pro-rpe-summary-card{
    padding:12px 10px!important;
    border-radius:14px!important;
  }
  .pro-rpe-summary-card>span{
    font-size:.67rem;
  }
  .pro-rpe-summary-card>strong{
    font-size:1.35rem!important;
  }
  .pro-rpe-meter{
    height:7px;
  }
  .pro-rpe-insight{
    font-size:.69rem;
  }
}
'''

          jsx_path.write_text(jsx)
          css_path.write_text(css)
          PY

      - name: Commit UI improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/TrainingPageProfessional.jsx react-migration/src/pages/TrainingPageProfessional.css
          if git diff --cached --quiet; then
            echo "Completed session UI already up to date"
          else
            git commit -m "Polish completed training session UI"
            git push origin HEAD:react-vite-migration
          fi
