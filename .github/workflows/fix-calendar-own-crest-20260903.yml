name: Fix calendar own crest 20260903

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/fix-calendar-own-crest-20260903.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0

      - name: Fix calendar team asset paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('react-migration/src/pages/CalendarPage.jsx')
          text = path.read_text()

          old = """function normalizeAssetUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return null;
  if (/^(https?:|data:|blob:)/i.test(raw)) return raw;
  if (raw.startsWith('/../')) return raw.replace(/^\\/\\.\\.\\//, '../');
  if (raw.startsWith('../') || raw.startsWith('./')) return raw;
  if (raw.startsWith('/')) return `..${raw}`;
  return `../${raw.replace(/^\\/+/, '')}`;
}"""

          new = """function normalizeAssetUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return null;
  if (/^(https?:|data:|blob:)/i.test(raw)) return raw;
  const relative = raw
    .replace(/^(?:\\.\\.\\/)+/, '')
    .replace(/^\\.\\//, '')
    .replace(/^\\/+/, '');
  if (!relative) return null;
  return new URL(relative, document.baseURI).href;
}"""

          if old not in text:
              raise SystemExit('normalizeAssetUrl marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-migration/package.json

      - name: Build
        working-directory: react-migration
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/CalendarPage.jsx
          git commit -m "Fix calendar team crest asset paths" || exit 0
          git pull --rebase origin react-vite-migration
          git push origin HEAD:react-vite-migration
