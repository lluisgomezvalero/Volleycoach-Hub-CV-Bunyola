name: Sync profile display name

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - .github/workflows/sync-profile-display-name-20260830.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Sincronizar nombre deportivo
        run: python3 .github/scripts/sync_profile_display_name_20260830.py
      - name: Limpiar temporales y guardar
        shell: bash
        run: |
          rm .github/scripts/sync_profile_display_name_20260830.py
          rm .github/workflows/sync-profile-display-name-20260830.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mantener nombre de Plantilla sincronizado con Mi Perfil"
          git push origin HEAD:react-vite-migration
