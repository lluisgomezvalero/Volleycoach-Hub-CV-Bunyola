name: I18N phase 3

on:
  push:
    branches:
      - feature/i18n-phase3-20260826
    paths:
      - .github/workflows/i18n-phase3-20260826.yml

permissions:
  contents: write

jobs:
  patch-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/i18n-phase3-20260826

      - name: Apply phase 3 patch
        run: python3 .github/scripts/i18n_phase3.py

      - name: Validate JavaScript
        run: |
          node --check i18n-es-ca-20260826.js
          for f in player-passport-priority-20260813.js performance-mobile-ux-20260823.js team-attendance-overview-20260812.js game-plan-canonical-20260817.js match-statistics-player-polish-20260819.js match-statistics-player-mobile-ux-20260824.js wellness-svg-point-tooltip-20260823.js calendar-mobile-app-ux-20260820.js calendar-profile-roster-fixes-20260825.js wellness-rpe-session-detail-20260822.js wellness-individual-tracking-20260822.js training-load-team-dashboard-20260809.js training-load-player-dashboard-20260809.js; do
            node --check "$f"
          done
          grep -q "CONVOCATÒRIA" i18n-es-ca-20260826.js
          grep -q "callupMatch" i18n-es-ca-20260826.js
          grep -q "20260826i18n3" supabase-config.js

      - name: Commit phase 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/i18n-phase3-20260826.yml .github/scripts/i18n_phase3.py
          git add -A
          git commit -m "Complete dynamic Catalan translations and locale dates"
          git push origin HEAD:feature/i18n-phase3-20260826
