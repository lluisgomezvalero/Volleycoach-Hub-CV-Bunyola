name: Patch square serve courts 20260828

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/patch-square-serve-courts-20260828.yml'
      - 'scripts/patch_square_serve_courts_20260828.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/patch_square_serve_courts_20260828.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/GamePlanPage.css
          git commit -m "Cuadrar pistas de saque en Plan de juego"
          git push origin HEAD:react-vite-migration
