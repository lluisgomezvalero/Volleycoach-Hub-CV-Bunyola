name: Run calendar match crests 20260829

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - 'react-migration/patch_calendar_match_crests_20260829.py'
      - '.github/workflows/run-calendar-match-crests-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Apply calendar match crests patch
        run: python react-migration/patch_calendar_match_crests_20260829.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/CalendarPage.jsx react-migration/src/pages/CalendarPage.css
          git diff --cached --quiet && exit 0
          git commit -m "Mostrar los dos escudos en partidos del calendario"
          git push origin HEAD:react-vite-migration
