name: Restore native time picker 20260902

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/fix-mobile-controls-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
      - name: Restore native clock picker
        run: |
          python - <<'PY'
          from pathlib import Path

          calendar = Path('react-migration/src/pages/CalendarPage.jsx')
          text = calendar.read_text()
          custom_state = """  const [hourPart = '00', minutePart = '00'] = String(form.time || '00:00').split(':');
  const hourOptions = Array.from({ length: 24 }, (_, hour) => String(hour).padStart(2, '0'));
  const minuteOptions = Array.from({ length: 12 }, (_, index) => String(index * 5).padStart(2, '0'));
  if (!minuteOptions.includes(minutePart)) minuteOptions.push(minutePart);
  minuteOptions.sort();
"""
          text = text.replace(custom_state, '', 1)
          custom_time = """            <label><span>Hora</span><div className=\"calendar-time-selects\"><select aria-label=\"Hora\" value={hourPart} onChange={(e) => setForm((prev) => ({ ...prev, time: `${e.target.value}:${minutePart}` }))}>{hourOptions.map((hour) => <option key={hour} value={hour}>{hour}</option>)}</select><b>:</b><select aria-label=\"Minutos\" value={minutePart} onChange={(e) => setForm((prev) => ({ ...prev, time: `${hourPart}:${e.target.value}` }))}>{minuteOptions.map((minute) => <option key={minute} value={minute}>{minute}</option>)}</select></div></label>"""
          native_time = """            <label><span>Hora</span><input type=\"time\" step=\"300\" value={form.time} onChange={(e) => setForm((prev) => ({ ...prev, time: e.target.value }))} required /></label>"""
          if custom_time not in text:
              raise SystemExit('Custom time selector not found')
          text = text.replace(custom_time, native_time, 1)
          calendar.write_text(text)

          css = Path('react-migration/src/pages/CalendarPage.css')
          c = css.read_text()
          block = """\n\n/* mobile-time-control-20260902 */
.calendar-time-selects{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:7px;width:100%}.calendar-time-selects select{width:100%;min-width:0}.calendar-time-selects b{color:#667085;font-size:1rem;text-align:center}
"""
          c = c.replace(block, '', 1)
          css.write_text(c)
          PY
      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mobile-controls-20260902.yml
          git add react-migration/src/pages/CalendarPage.jsx react-migration/src/pages/CalendarPage.css
          git commit -m "Restore native Android clock picker"
          git push origin HEAD:react-vite-migration
