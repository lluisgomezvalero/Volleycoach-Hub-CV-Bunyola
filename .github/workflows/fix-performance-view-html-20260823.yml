name: Fix performance view HTML

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-performance-view-html-20260823.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move performance panel into its own view
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          start_marker = '        <div id="training-performance-panel" class="performance-panel" hidden>'
          session_marker = '      <div id="session-center-detail" class="session-center-detail" hidden></div>'
          tactics_marker = '    <!-- ==========================================================================' + '\n         ISLA 5: PLAN DE JUEGO'

          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('performance panel start not found')
          session = s.find(session_marker, start)
          if session < 0:
              raise SystemExit('session detail marker not found')

          segment = s[start:session]
          close_session_list = '      </div>\n'
          if not segment.endswith(close_session_list):
              raise SystemExit('unexpected training/performance structure')

          panel = segment[:-len(close_session_list)]
          panel = panel.replace('class="performance-panel" hidden', 'class="performance-panel"', 1)

          # Leave only the session-list closing tag inside Entrenos.
          s = s[:start] + close_session_list + s[session:]

          # Insert Rendimiento as a real top-level page view after Entrenos.
          training_close = session_marker + '\n    </div>\n\n'
          insertion = (
              session_marker + '\n    </div>\n\n'
              '    <!-- ==========================================================================' + '\n'
              '         MÓDULO: RENDIMIENTO FÍSICO' + '\n'
              '         ========================================================================== -->' + '\n'
              '    <div id="view-fitness" class="page-view coach-only-view">' + '\n'
              + panel + '\n'
              '    </div>\n\n'
          )
          if training_close not in s:
              raise SystemExit('training closing structure not found')
          s = s.replace(training_close, insertion, 1)

          # Sanity checks: exactly one real fitness view and panel is no longer hidden.
          if s.count('id="view-fitness"') != 1:
              raise SystemExit('fitness view count is not 1')
          if s.count('id="training-performance-panel"') != 1:
              raise SystemExit('performance panel count is not 1')
          if 'id="training-performance-panel" class="performance-panel" hidden' in s:
              raise SystemExit('performance panel is still hidden')

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Create real performance page view"
          git push

          git rm .github/workflows/fix-performance-view-html-20260823.yml
          git commit -m "Remove one-time performance view workflow"
          git push
