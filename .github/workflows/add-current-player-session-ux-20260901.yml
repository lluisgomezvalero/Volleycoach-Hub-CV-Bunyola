name: Add current player session UX 20260901

on:
  push:
    branches: [main]
    paths:
      - 'player-session-ux-current-20260901.js'
      - '.github/workflows/add-current-player-session-ux-20260901.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add enhancer to production index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='    <script src="player-session-ux-current-20260901.js?v=20260901a"></script>\n'
          if 'player-session-ux-current-20260901.js' not in s:
              anchor='    <script src="pwa-mobile-shell-20260825.js?v=20260901push1"></script>\n'
              if anchor not in s:
                  raise SystemExit('PWA anchor not found')
              s=s.replace(anchor, anchor+tag, 1)
          p.write_text(s)
          PY
      - name: Commit production index
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable player comment editing in current app"
          git push origin HEAD:main
