name: Restore native time and cleanup

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/restore-native-time-cleanup.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Restore native time picker files
        run: |
          git checkout 31f49a49e7a6e4ec4e779e88337062175df39c76 -- react-migration/src/pages/CalendarPage.jsx react-migration/src/pages/CalendarPage.css
      - name: Commit restored native picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-mobile-controls-20260902.yml .github/workflows/restore-native-time-cleanup.yml
          git add react-migration/src/pages/CalendarPage.jsx react-migration/src/pages/CalendarPage.css
          git commit -m "Restore native Android time picker"
          git push origin HEAD:react-vite-migration
