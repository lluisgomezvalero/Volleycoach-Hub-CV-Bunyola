name: Switch to lightweight i18n v2

on:
  push:
    branches:
      - fix/i18n-v2-core-20260826
    paths:
      - .github/workflows/switch-i18n-v2-20260826.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-v2-core-20260826

      - name: Replace global translator and harden competition names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg=Path('supabase-config.js')
          s=cfg.read_text(encoding='utf-8')
          s2,n=re.subn(r"'i18n-es-ca-20260826\.js\?v=[^']+',", "'i18n-core-v2-20260826.js?v=20260826i18nv2a',", s, count=1)
          if n!=1:
              raise SystemExit('No se encontró el script i18n antiguo en supabase-config.js')
          s2=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260826i18nv2a';", s2, count=1)
          cfg.write_text(s2,encoding='utf-8')

          p=Path('competition-app-ux-20260820.js')
          c=p.read_text(encoding='utf-8')
          c=c.replace("team:find('EQUIPO','TEAM'),", "team:find('EQUIPO','EQUIP','TEAM'),")
          c=c.replace("points:find('PTS','PUNTOS','PTOS'),", "points:find('PTS','PUNTOS','PUNTS','PTOS'),")
          c=c.replace("actions:find('ACCIONES','ACCIÓN','ACCION')", "actions:find('ACCIONES','ACCIONS','ACCIÓN','ACCION')")
          old="""  const img=row.querySelector('img');\n  const teamName=text(teamCell).replace(/Automático/gi,'').replace(/Editar/gi,'').trim()||`Equipo ${index+1}`;\n  const own=row.classList.contains('league-own-team-row')||/CV\\s*BUNYOLA/i.test(teamName);\n"""
          new="""  const img=row.querySelector('img');\n  let stateTeam=null;\n  try{stateTeam=(typeof appState!=='undefined'&&Array.isArray(appState?.leagueTable))?appState.leagueTable[index]:null;}catch(_){}\n  const extracted=text(teamCell).replace(/Automático|Automàtic/gi,'').replace(/Editar/gi,'').trim();\n  const generic=/^(?:Equipo|Equip)\\s+\\d+$/i.test(extracted);\n  const teamName=String(stateTeam?.name||(!generic?extracted:'')||`Equipo ${index+1}`);\n  const own=Boolean(stateTeam?.isOwn)||row.classList.contains('league-own-team-row')||/CV\\s*BUNYOLA/i.test(teamName);\n"""
          if old not in c:
              raise SystemExit('No se encontró bloque rowData esperado')
          c=c.replace(old,new,1)
          c=c.replace("logo:img?.getAttribute('src')||'assets/default_avatar.svg',", "logo:stateTeam?.logo||img?.getAttribute('src')||'assets/default_avatar.svg',",1)
          p.write_text(c,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check i18n-core-v2-20260826.js
          node --check competition-app-ux-20260820.js
          grep -q "i18n-core-v2-20260826.js?v=20260826i18nv2a" supabase-config.js
          ! grep -q "i18n-es-ca-20260826.js" supabase-config.js
          grep -q "stateTeam?.name" competition-app-ux-20260820.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/switch-i18n-v2-20260826.yml
          git add supabase-config.js competition-app-ux-20260820.js i18n-core-v2-20260826.js
          git commit -m "Replace DOM translator with lightweight i18n core"
          git push origin HEAD:fix/i18n-v2-core-20260826
