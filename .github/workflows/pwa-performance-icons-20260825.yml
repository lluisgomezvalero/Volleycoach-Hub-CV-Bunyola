name: PWA performance and icons

on:
  push:
    branches:
      - fix/pwa-performance-icons-20260825
    paths:
      - '.github/workflows/pwa-performance-icons-20260825.yml'
      - 'pwa-mobile-shell.css'
      - 'pwa-mobile-shell-20260825.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'index.html'
      - 'assets/club_logo.png'

permissions:
  contents: write

jobs:
  optimize-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare icon tooling
        run: python -m pip install --quiet pillow

      - name: Generate launcher icons from existing club logo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_path = Path('assets/club_logo.png')
          source = Image.open(source_path).convert('RGBA')
          print(f'SOURCE_LOGO_DIMENSIONS={source.width}x{source.height}')

          def build(size, output, padding_ratio=0.07):
              canvas = Image.new('RGBA', (size, size), (248, 250, 252, 255))
              max_side = max(1, round(size * (1 - 2 * padding_ratio)))
              scale = min(max_side / source.width, max_side / source.height)
              width = max(1, round(source.width * scale))
              height = max(1, round(source.height * scale))
              logo = source.resize((width, height), Image.Resampling.LANCZOS)
              x = (size - width) // 2
              y = (size - height) // 2
              canvas.alpha_composite(logo, (x, y))
              canvas.convert('RGB').save(output, 'PNG', optimize=True)
              print(f'GENERATED={output}:{size}x{size}')

          build(180, 'assets/apple-touch-icon.png', 0.07)
          build(192, 'assets/pwa-icon-192.png', 0.07)
          build(512, 'assets/pwa-icon-512.png', 0.07)
          build(512, 'assets/pwa-icon-maskable-512.png', 0.18)
          PY

      - name: Point manifest and iOS metadata to exact-size icons
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text())
          manifest['icons'] = [
              {'src':'assets/pwa-icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'assets/pwa-icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'assets/pwa-icon-maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          index_path = Path('index.html')
          html = index_path.read_text()
          html = html.replace('manifest.webmanifest?v=20260825pwa1', 'manifest.webmanifest?v=20260825pwa2')
          html = html.replace('pwa-mobile-shell.css?v=20260825pwa1', 'pwa-mobile-shell.css?v=20260825pwa2')
          html = html.replace('pwa-mobile-shell-20260825.js?v=20260825pwa1', 'pwa-mobile-shell-20260825.js?v=20260825pwa2')
          html = html.replace('<link rel="apple-touch-icon" href="assets/club_logo.png">', '<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=20260825pwa2">')
          html = html.replace('<link rel="icon" type="image/png" href="assets/club_logo.png">', '<link rel="icon" type="image/png" sizes="192x192" href="assets/pwa-icon-192.png?v=20260825pwa2">')
          index_path.write_text(html)
          PY

      - name: Validate optimized PWA
        run: |
          node --check pwa-mobile-shell-20260825.js
          node --check service-worker.js
          python -m json.tool manifest.webmanifest >/dev/null
          python - <<'PY'
          from PIL import Image
          expected={
            'assets/apple-touch-icon.png':(180,180),
            'assets/pwa-icon-192.png':(192,192),
            'assets/pwa-icon-512.png':(512,512),
            'assets/pwa-icon-maskable-512.png':(512,512),
          }
          for path,size in expected.items():
              im=Image.open(path)
              assert im.size==size,(path,im.size,size)
          PY
          grep -q '20260825pwa2' index.html
          grep -q 'pwa-icon-192.png' manifest.webmanifest
          grep -q "request.mode!=='navigate'" service-worker.js

      - name: Commit generated icons and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest assets/apple-touch-icon.png assets/pwa-icon-192.png assets/pwa-icon-512.png assets/pwa-icon-maskable-512.png
          if git diff --cached --quiet; then
            echo 'Generated assets already current'
          else
            git commit -m 'Generate crisp PWA launcher icons and bump cache version'
            git push
          fi
