name: Translation cleanup and stability fixes
on:
  push:
    branches: [fix/remove-i18n-profile-stability-20260826]
    paths: ['.github/workflows/remove-i18n-profile-stability-v2-20260826.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/remove_i18n_profile_stability_20260826.py
      - name: Validate JavaScript and cleanup
        shell: bash
        run: |
          set -e
          test ! -e i18n-core-v2-20260826.js
          test ! -e i18n-es-ca-20260826.js
          if grep -R -E "VolleyI18n|i18n-core-v2|i18n-es-ca|volleycoach_preferred_language" --include='*.js' --include='*.html' --exclude-dir='.github' .; then exit 1; fi
          if grep -q "preferred_language" supabase-client.js; then exit 1; fi
          grep -q "profile-attendance-card','profile-achievements-card" calendar-profile-roster-fixes-20260825.js
          grep -q "first-paint stability" styles.css
          grep -q "20260826stability1" index.html
          grep -q "20260826stability1" supabase-config.js
          node --check calendar-profile-roster-fixes-20260825.js
          node --check competition-app-ux-20260820.js
          node --check supabase-client.js
          node --check supabase-config.js
          node --check calendar-mobile-app-ux-20260820.js
          node --check game-plan-canonical-20260817.js
          node --check match-statistics-player-mobile-ux-20260824.js
          node --check match-statistics-player-polish-20260819.js
          node --check performance-mobile-ux-20260823.js
          node --check player-passport-priority-20260813.js
          node --check team-attendance-overview-20260812.js
          node --check training-load-player-dashboard-20260809.js
          node --check training-load-team-dashboard-20260809.js
          node --check wellness-individual-tracking-20260822.js
          node --check wellness-rpe-session-detail-20260822.js
          node --check wellness-svg-point-tooltip-20260823.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/remove-i18n-profile-stability-20260826.yml .github/workflows/remove-i18n-profile-stability-v2-20260826.yml .github/scripts/remove_i18n_profile_stability_20260826.py
          git add -A
          git commit -m "Remove translation system and stabilize profile UI"
          git push
