name: Patch Inicio y Competicion

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - .github/workflows/patch-home-competition-20260827.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Aplicar ajustes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('react-migration/src/pages/HomePage.jsx')
          text = home.read_text()
          old = '''        const [futureResult, pastTrainingResult, recentMatchResult] = await Promise.all([\n          supabase\n            .from('events')\n            .select('id,team_id,event_type,title,starts_at,ends_at,location,status,payload')\n            .eq('team_id', team.id)\n            .gte('starts_at', now.toISOString())\n            .order('starts_at', { ascending: true })\n            .limit(20),\n          supabase\n            .from('events')\n            .select('id,starts_at,ends_at,payload')\n            .eq('team_id', team.id)\n            .eq('event_type', 'training')\n            .gte('starts_at', from28)\n            .lte('starts_at', now.toISOString())\n            .order('starts_at', { ascending: false })\n            .limit(30),\n          supabase\n            .from('events')\n            .select('id,event_type,title,starts_at,payload')\n            .eq('team_id', team.id)\n            .in('event_type', ['match', 'friendly', 'tournament'])\n            .lt('starts_at', now.toISOString())\n            .order('starts_at', { ascending: false })\n            .limit(5)\n        ]);\n\n        if (futureResult.error) throw futureResult.error;\n        if (pastTrainingResult.error) throw pastTrainingResult.error;\n        if (recentMatchResult.error) throw recentMatchResult.error;\n\n        const future = futureResult.data || [];\n        const training = future.find((event) => event.event_type === 'training') || null;\n        const match = future.find((event) => ['match', 'friendly', 'tournament'].includes(event.event_type)) || null;\n        const pastTrainings = pastTrainingResult.data || [];\n\n        // En jugadoras, no bloqueamos las tarjetas principales mientras termina de\n        // cargarse el resumen personal de las últimas semanas.\n        if (!isStaff && active) {\n          setNextTraining(training);\n          setNextMatch(match);\n          setRecentMatches(recentMatchResult.data || []);\n          setLoading(false);\n        }\n'''
          new = '''        const futureRequest = supabase\n          .from('events')\n          .select('id,team_id,event_type,title,starts_at,ends_at,location,status,payload')\n          .eq('team_id', team.id)\n          .gte('starts_at', now.toISOString())\n          .order('starts_at', { ascending: true })\n          .limit(12);\n        const pastTrainingRequest = supabase\n          .from('events')\n          .select('id,starts_at,ends_at,payload')\n          .eq('team_id', team.id)\n          .eq('event_type', 'training')\n          .gte('starts_at', from28)\n          .lte('starts_at', now.toISOString())\n          .order('starts_at', { ascending: false })\n          .limit(30);\n        const recentMatchRequest = supabase\n          .from('events')\n          .select('id,event_type,title,starts_at,payload')\n          .eq('team_id', team.id)\n          .in('event_type', ['match', 'friendly', 'tournament'])\n          .lt('starts_at', now.toISOString())\n          .order('starts_at', { ascending: false })\n          .limit(5);\n\n        // Para jugadoras, la pantalla principal depende solo del calendario futuro.\n        // Historial y tendencias continúan cargándose en segundo plano.\n        let futureResult;\n        let pastTrainingResult;\n        let recentMatchResult;\n        if (!isStaff) {\n          futureResult = await futureRequest;\n          if (futureResult.error) throw futureResult.error;\n          const quickFuture = futureResult.data || [];\n          const quickTraining = quickFuture.find((event) => event.event_type === 'training') || null;\n          const quickMatch = quickFuture.find((event) => ['match', 'friendly', 'tournament'].includes(event.event_type)) || null;\n          if (active) {\n            setNextTraining(quickTraining);\n            setNextMatch(quickMatch);\n            setLoading(false);\n          }\n          [pastTrainingResult, recentMatchResult] = await Promise.all([pastTrainingRequest, recentMatchRequest]);\n        } else {\n          [futureResult, pastTrainingResult, recentMatchResult] = await Promise.all([futureRequest, pastTrainingRequest, recentMatchRequest]);\n        }\n\n        if (futureResult.error) throw futureResult.error;\n        if (pastTrainingResult.error) throw pastTrainingResult.error;\n        if (recentMatchResult.error) throw recentMatchResult.error;\n\n        const future = futureResult.data || [];\n        const training = future.find((event) => event.event_type === 'training') || null;\n        const match = future.find((event) => ['match', 'friendly', 'tournament'].includes(event.event_type)) || null;\n        const pastTrainings = pastTrainingResult.data || [];\n'''
          if old not in text:
              raise SystemExit('No se encontró el bloque de carga de HomePage')
          home.write_text(text.replace(old, new, 1))

          competition = Path('react-migration/src/pages/CompetitionPage.jsx')
          text = competition.read_text()
          hero = '''      <header className="competition-hero">\n        <div className="competition-hero-icon"><Trophy size={24} /></div>\n        <div className="competition-hero-copy">\n          <span>Competición · Liga {season}</span>\n          <h1>Clasificación de Liga</h1>\n          <p>Cadete Femenino 1ª División · {sorted.length || 12} equipos</p>\n        </div>\n        {isStaff ? <span className="competition-staff-pill"><ShieldCheck size={14} /> Panel técnico</span> : null}\n      </header>\n\n'''
          if hero not in text:
              raise SystemExit('No se encontró la cabecera de Competición')
          text = text.replace(hero, '', 1)

          old_head = '''        <div className="competition-card-head">\n          <div><small>12 equipos</small><h2>Tabla clasificatoria</h2><p>{isStaff ? 'CV Bunyola se actualiza sola; puedes editar los datos del resto de equipos.' : 'Clasificación compartida del equipo.'}</p></div>\n          {isStaff ? (\n            <button type="button" className="competition-reset-button" onClick={resetRivals} disabled={resetting} title="Reiniciar clasificación"><RefreshCcw size={17} /> <span>{resetting ? 'Reiniciando…' : 'Reiniciar'}</span></button>\n          ) : null}\n        </div>\n\n        <label className="competition-search"><Search size={17} /><input value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Buscar equipo…" /></label>\n'''
          new_head = '''        <div className="competition-toolbar">\n          <label className="competition-search"><Search size={17} /><input value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Buscar equipo…" /></label>\n          {isStaff ? (\n            <button type="button" className="competition-reset-button" onClick={resetRivals} disabled={resetting} title="Reiniciar clasificación" aria-label="Reiniciar clasificación"><RefreshCcw size={17} /> <span>{resetting ? 'Reiniciando…' : 'Reiniciar'}</span></button>\n          ) : null}\n        </div>\n'''
          if old_head not in text:
              raise SystemExit('No se encontró el encabezado de la tabla')
          text = text.replace(old_head, new_head, 1)

          info = '''\n      <section className="competition-info-card">\n        <Trophy size={18} />\n        <div><strong>Cómo se calcula CV Bunyola</strong><p>La fila del equipo usa exclusivamente los resultados de los partidos de Liga. Los amistosos y torneos no alteran esta clasificación. {matches.filter((event) => normalizeResult(event?.payload?.result)).length ? `${matches.filter((event) => normalizeResult(event?.payload?.result)).length} jornadas con resultado registradas.` : 'Aún no hay jornadas con resultado registrado.'}</p></div>\n      </section>\n'''
          if info not in text:
              raise SystemExit('No se encontró la explicación final de Competición')
          text = text.replace(info, '', 1)
          competition.write_text(text)

          css = Path('react-migration/src/pages/CompetitionPage.css')
          styles = css.read_text()
          styles += '''\n/* Compactación visual solicitada: resumen + clasificación, sin cabeceras redundantes. */\n.competition-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;min-width:0}.competition-toolbar .competition-search{flex:1;margin-bottom:0}.competition-toolbar .competition-reset-button{flex:0 0 auto}@media(max-width:760px){.competition-toolbar{margin-bottom:9px}.competition-toolbar .competition-search{width:auto}.competition-toolbar .competition-reset-button{width:40px;height:40px;min-width:40px}}\n'''
          css.write_text(styles)
          PY
      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/HomePage.jsx react-migration/src/pages/CompetitionPage.jsx react-migration/src/pages/CompetitionPage.css
          git commit -m "Acelerar Inicio y simplificar Competición"
          git push origin HEAD:react-vite-migration
