name: Run fix calendar split 20260829

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - 'react-migration/fix_calendar_split_20260829.py'
      - '.github/workflows/run-fix-calendar-split-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Fix CalendarPage split
        run: python react-migration/fix_calendar_split_20260829.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/CalendarPage.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Corregir compilación del calendario con escudos"
          git push origin HEAD:react-vite-migration
