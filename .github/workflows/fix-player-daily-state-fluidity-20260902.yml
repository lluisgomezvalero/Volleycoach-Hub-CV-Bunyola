name: Fix player daily state and fluidity 20260902

on:
  push:
    branches: [react-vite-migration]
    paths:
      - '.github/workflows/fix-player-daily-state-fluidity-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Apply fixes
        run: python scripts/fix_player_daily_state_fluidity_20260902.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/App.jsx \
                  react-migration/src/pages/HomePage.jsx \
                  react-migration/src/pages/HomePageDashboard.css \
                  react-migration/src/pages/TrainingPageProfessional.jsx \
                  react-migration/src/pages/WellnessPage.jsx \
                  react-migration/src/pages/CalendarPage.jsx \
                  react-migration/src/components/WellnessPlayerCheckin.jsx
          git commit -m "Fix daily response windows and smooth core navigation"
          git push origin HEAD:react-vite-migration
