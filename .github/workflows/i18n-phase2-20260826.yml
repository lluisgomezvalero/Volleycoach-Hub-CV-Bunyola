name: I18N phase 2

on:
  push:
    branches:
      - feature/i18n-phase2-20260826
    paths:
      - .github/workflows/i18n-phase2-20260826.yml

permissions:
  contents: write

jobs:
  patch-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/i18n-phase2-20260826

      - name: Apply i18n phase 2 patch
        run: python3 i18n-phase2-patch.py

      - name: Validate JavaScript and wiring
        run: |
          node --check i18n-es-ca-20260826.js
          grep -q "queueMutationWork" i18n-es-ca-20260826.js
          grep -q "20260826i18n2" supabase-config.js
          ! grep -q "function scheduleApply" i18n-es-ca-20260826.js

      - name: Commit phase 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n-es-ca-20260826.js supabase-config.js
          git rm .github/workflows/i18n-phase2-20260826.yml i18n-phase2-patch.py
          git commit -m "Expand bilingual UI and optimize language updates"
          git push origin HEAD:feature/i18n-phase2-20260826
