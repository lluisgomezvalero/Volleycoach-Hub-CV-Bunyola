name: Lock coach planned RPE

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/lock-coach-rpe-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0

      - name: Lock coach RPE after first save
        run: |
          python - <<'PY'
          from pathlib import Path

          jsx_path = Path('react-migration/src/pages/TrainingPageProfessional.jsx')
          css_path = Path('react-migration/src/pages/TrainingPageProfessional.css')
          jsx = jsx_path.read_text()
          css = css_path.read_text()

          old = '''            <RpeScale value={rpeValue} onChange={setRpeValue} disabled={rpeSaving} />
            <button className="pro-primary-action" type="button" onClick={() => void saveRpe()} disabled={rpeSaving}><Save size={17} /> {rpeSaving ? 'Guardando…' : isStaff ? 'Guardar RPE' : 'Guardar mi RPE'}</button>
            {rpeSaved ? <p className="pro-success-copy"><Check size={15} /> {rpeSaved}</p> : null}'''

          new = '''            {isStaff && coachRpe ? (
              <div className="pro-rpe-locked">
                <Check size={18} />
                <span><strong>RPE previsto registrado</strong><small>Este valor queda cerrado y ya no puede modificarse.</small></span>
              </div>
            ) : (
              <>
                <RpeScale value={rpeValue} onChange={setRpeValue} disabled={rpeSaving} />
                <button className="pro-primary-action" type="button" onClick={() => void saveRpe()} disabled={rpeSaving}><Save size={17} /> {rpeSaving ? 'Guardando…' : isStaff ? 'Guardar RPE' : 'Guardar mi RPE'}</button>
                {rpeSaved ? <p className="pro-success-copy"><Check size={15} /> {rpeSaved}</p> : null}
              </>
            )}'''

          if old not in jsx:
              raise SystemExit('No se encontró el bloque RPE esperado')
          jsx = jsx.replace(old, new, 1)

          marker = '/* coach-rpe-lock-20260827 */'
          if marker not in css:
              css += '''\n\n/* coach-rpe-lock-20260827 */\n.pro-rpe-locked{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid #cfe5d8;border-radius:14px;background:#f1faf5;color:#176b48}.pro-rpe-locked>svg{flex:0 0 auto}.pro-rpe-locked>span{display:grid;gap:2px}.pro-rpe-locked strong{font-size:.78rem}.pro-rpe-locked small{color:#5f7d6d;font-size:.68rem;line-height:1.35}@media(max-width:820px){.pro-rpe-locked{padding:12px;border-radius:13px}}\n'''

          jsx_path.write_text(jsx)
          css_path.write_text(css)
          PY

      - name: Commit RPE lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/TrainingPageProfessional.jsx react-migration/src/pages/TrainingPageProfessional.css
          if git diff --cached --quiet; then
            echo "Coach RPE already locked"
          else
            git commit -m "Lock coach planned RPE after save"
            git push origin HEAD:react-vite-migration
          fi
