name: Load wellness SVG point tooltip

on:
  push:
    paths:
      - '.github/workflows/load-wellness-svg-tooltip-20260823.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load tooltip script and refresh cache
        run: |
          node --check wellness-svg-point-tooltip-20260823.js
          python - <<'PY'
          from pathlib import Path

          config=Path('supabase-config.js')
          s=config.read_text()
          old="window.VOLLEY_ASSET_VERSION = '20260822h';"
          new="window.VOLLEY_ASSET_VERSION = '20260823a';"
          if old not in s: raise SystemExit('Asset version anchor missing')
          s=s.replace(old,new,1)
          anchor="  'wellness-svg-chart-20260822.js?v=20260822a',"
          addition=anchor+"\n  'wellness-svg-point-tooltip-20260823.js?v=20260823a',"
          if anchor not in s: raise SystemExit('SVG chart anchor missing')
          s=s.replace(anchor,addition,1)
          config.write_text(s)

          index=Path('index.html')
          s=index.read_text()
          old='supabase-config.js?v=20260822safe63'
          new='supabase-config.js?v=20260823safe64'
          if old not in s: raise SystemExit('Index cache anchor missing')
          index.write_text(s.replace(old,new,1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Load wellness SVG point tooltip"
          git push

          git rm .github/workflows/load-wellness-svg-tooltip-20260823.yml
          git commit -m "Remove one-time wellness SVG tooltip workflow"
          git push
