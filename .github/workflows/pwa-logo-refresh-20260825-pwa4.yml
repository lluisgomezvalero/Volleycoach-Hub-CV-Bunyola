name: Refresh CV Bunyola app logo

on:
  push:
    branches:
      - fix/pwa-logo-refresh-20260825-pwa4
    paths:
      - '.github/workflows/pwa-logo-refresh-20260825-pwa4.yml'
      - 'assets/cvb-logo-source.part1.b64'
      - 'assets/cvb-logo-source.part2.b64'
      - 'assets/cvb-logo-source.part3.b64'
      - 'assets/cvb-logo-source.part4a1.b64'
      - 'assets/cvb-logo-source.part4a2.b64'
      - 'assets/cvb-logo-source.part4.b64'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pwa-logo-refresh-20260825-pwa4.yml'
      - 'assets/cvb-logo-source.part1.b64'
      - 'assets/cvb-logo-source.part2.b64'
      - 'assets/cvb-logo-source.part3.b64'
      - 'assets/cvb-logo-source.part4a1.b64'
      - 'assets/cvb-logo-source.part4a2.b64'
      - 'assets/cvb-logo-source.part4.b64'
      - 'assets/apple-touch-icon.png'
      - 'assets/pwa-icon-192.png'
      - 'assets/pwa-icon-512.png'
      - 'assets/pwa-icon-maskable-512.png'
      - 'index.html'
      - 'manifest.webmanifest'

permissions:
  contents: write

jobs:
  regenerate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare icon tooling
        run: python -m pip install --quiet pillow

      - name: Decode source and generate icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, json

          def compact(path):
              return ''.join(Path(path).read_text(encoding='utf-8').split())

          # One transported chunk gained three stray characters. Recover the
          # exact 3500-character chunk before rebuilding the source image.
          a1 = compact('assets/cvb-logo-source.part4a1.b64')
          expected_a1 = '5f4aae072803313a891e100492956c8d9b8f918eb755572da9982e92eb07d8da'
          if hashlib.sha256(a1.encode()).hexdigest() != expected_a1:
              assert len(a1) == 3503, len(a1)
              repaired = None
              for i in range(len(a1) - 2):
                  candidate = a1[:i] + a1[i+3:]
                  if hashlib.sha256(candidate.encode()).hexdigest() == expected_a1:
                      repaired = candidate
                      break
              assert repaired is not None, 'Unable to repair source chunk exactly'
              a1 = repaired
          assert len(a1) == 3500

          parts = [
              compact('assets/cvb-logo-source.part1.b64'),
              compact('assets/cvb-logo-source.part2.b64'),
              compact('assets/cvb-logo-source.part3.b64'),
              a1,
              compact('assets/cvb-logo-source.part4a2.b64'),
              compact('assets/cvb-logo-source.part4.b64'),
          ]
          raw = ''.join(parts)
          assert len(raw) == 31548, len(raw)
          source_bytes = base64.b64decode(raw, validate=True)
          print('decoded source sha256:', hashlib.sha256(source_bytes).hexdigest())

          source_path = Path('/tmp/cvb-logo-source.jpg')
          source_path.write_bytes(source_bytes)
          img = Image.open(source_path).convert('RGBA')
          img.load()
          assert img.size == (512, 512), img.size

          px = img.load()
          xs, ys = [], []
          for y in range(img.height):
              for x in range(img.width):
                  r, g, b, a = px[x, y]
                  if a and not (r > 235 and g > 235 and b > 235):
                      xs.append(x)
                      ys.append(y)
          assert xs and ys, 'No visible logo content detected'
          content = img.crop((min(xs), min(ys), max(xs) + 1, max(ys) + 1)).convert('RGBA')

          cp = content.load()
          for y in range(content.height):
              for x in range(content.width):
                  r, g, b, a = cp[x, y]
                  if a and r > 220 and g > 220 and b > 220:
                      cp[x, y] = (255, 255, 255, a)

          def make_icon(size, margin):
              canvas = Image.new('RGBA', (size, size), 'white')
              inner = int(size * (1 - 2 * margin))
              scale = min(inner / content.width, inner / content.height)
              w = max(1, round(content.width * scale))
              h = max(1, round(content.height * scale))
              resized = content.resize((w, h), Image.Resampling.LANCZOS)
              canvas.alpha_composite(resized, ((size - w) // 2, (size - h) // 2))
              return canvas.convert('RGB')

          make_icon(180, 0.08).save('assets/apple-touch-icon.png', 'PNG', optimize=True)
          make_icon(192, 0.08).save('assets/pwa-icon-192.png', 'PNG', optimize=True)
          make_icon(512, 0.08).save('assets/pwa-icon-512.png', 'PNG', optimize=True)
          make_icon(512, 0.15).save('assets/pwa-icon-maskable-512.png', 'PNG', optimize=True)

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src': 'assets/pwa-icon-192.png?v=20260825pwa4', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
              {'src': 'assets/pwa-icon-512.png?v=20260825pwa4', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
              {'src': 'assets/pwa-icon-maskable-512.png?v=20260825pwa4', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          for old in ('20260825pwa1', '20260825pwa2', '20260825pwa3'):
              html = html.replace(f'manifest.webmanifest?v={old}', 'manifest.webmanifest?v=20260825pwa4')
              html = html.replace(f'assets/apple-touch-icon.png?v={old}', 'assets/apple-touch-icon.png?v=20260825pwa4')
              html = html.replace(f'assets/pwa-icon-192.png?v={old}', 'assets/pwa-icon-192.png?v=20260825pwa4')
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate generated files
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat
          expected = {
              'assets/apple-touch-icon.png': (180, 180),
              'assets/pwa-icon-192.png': (192, 192),
              'assets/pwa-icon-512.png': (512, 512),
              'assets/pwa-icon-maskable-512.png': (512, 512),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  assert image.size == size, (path, image.size, size)
                  image.load()
                  extrema = image.convert('RGB').getextrema()
                  assert any(lo < 220 for lo, hi in extrema), (path, extrema)
          PY
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q '20260825pwa4' index.html
          grep -q '20260825pwa4' manifest.webmanifest

      - name: Commit generated assets
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/pwa-icon-192.png assets/pwa-icon-512.png assets/pwa-icon-maskable-512.png manifest.webmanifest index.html
          if git diff --cached --quiet; then
            echo 'PWA icons already current'
          else
            git commit -m 'Regenerate PWA icons from validated CV Bunyola logo'
            git push
          fi
