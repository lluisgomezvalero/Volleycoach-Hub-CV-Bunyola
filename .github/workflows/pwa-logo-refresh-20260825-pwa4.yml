name: Refresh CV Bunyola app logo

on:
  push:
    branches:
      - fix/pwa-logo-refresh-20260825-pwa4
    paths:
      - '.github/workflows/pwa-logo-refresh-20260825-pwa4.yml'
      - 'assets/apple-touch-icon.png'
      - 'assets/pwa-icon-192.png'

permissions:
  contents: write

jobs:
  regenerate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare icon tooling
        run: python -m pip install --quiet pillow
      - name: Generate icons and bump cache version
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          source = Image.open('assets/pwa-icon-192.png').convert('RGB')
          assert source.size == (192, 192), source.size
          source.resize((512, 512), Image.Resampling.LANCZOS).save('assets/pwa-icon-512.png', 'PNG', optimize=True)
          canvas = Image.new('RGB', (512, 512), 'white')
          inner = source.resize((360, 360), Image.Resampling.LANCZOS)
          canvas.paste(inner, ((512-360)//2, (512-360)//2))
          canvas.save('assets/pwa-icon-maskable-512.png', 'PNG', optimize=True)

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src':'assets/pwa-icon-192.png?v=20260825pwa4','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'assets/pwa-icon-512.png?v=20260825pwa4','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'assets/pwa-icon-maskable-512.png?v=20260825pwa4','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('manifest.webmanifest?v=20260825pwa3', 'manifest.webmanifest?v=20260825pwa4')
          html = html.replace('assets/apple-touch-icon.png?v=20260825pwa3', 'assets/apple-touch-icon.png?v=20260825pwa4')
          html = html.replace('assets/pwa-icon-192.png?v=20260825pwa3', 'assets/pwa-icon-192.png?v=20260825pwa4')
          index_path.write_text(html, encoding='utf-8')
          PY
      - name: Validate generated files
        run: |
          python - <<'PY'
          from PIL import Image
          expected = {
            'assets/apple-touch-icon.png': (180,180),
            'assets/pwa-icon-192.png': (192,192),
            'assets/pwa-icon-512.png': (512,512),
            'assets/pwa-icon-maskable-512.png': (512,512),
          }
          for path, size in expected.items():
              image = Image.open(path)
              assert image.size == size, (path, image.size, size)
          PY
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q '20260825pwa4' index.html
          grep -q '20260825pwa4' manifest.webmanifest
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pwa-icon-512.png assets/pwa-icon-maskable-512.png manifest.webmanifest index.html
          if git diff --cached --quiet; then
            echo 'PWA icons already current'
          else
            git commit -m 'Regenerate PWA icons from new CV Bunyola logo'
            git push
          fi
