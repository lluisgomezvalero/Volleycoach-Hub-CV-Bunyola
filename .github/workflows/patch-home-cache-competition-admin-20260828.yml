name: Patch Home cache and competition admin

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - .github/workflows/patch-home-cache-competition-admin-20260828.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Aplicar ajustes finales
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('react-migration/src/pages/HomePage.jsx')
          text = home.read_text()
          old = '''  const completedMatches = recentMatches.filter(completedMatch);\n  const planReady = gamePlan?.status === 'published';\n  const trainingCountdown = nextTraining ? daysUntil(nextTraining.starts_at) : null;\n  const matchCountdown = nextMatch ? daysUntil(nextMatch.starts_at) : null;\n  const trainingDate = nextTraining ? dateParts(nextTraining.starts_at) : null;\n  const matchDate = nextMatch ? dateParts(nextMatch.starts_at) : null;\n  const trainingPlan = nextTraining ? planLines(nextTraining) : [];\n'''
          new = '''  const completedMatches = recentMatches.filter(completedMatch);\n  const planReady = gamePlan?.status === 'published';\n  const primaryLoading = loading && !initialHomeEvents;\n  const displayNextTraining = loading ? (nextTraining || initialHomeEvents?.training || null) : nextTraining;\n  const displayNextMatch = loading ? (nextMatch || initialHomeEvents?.match || null) : nextMatch;\n  const trainingCountdown = displayNextTraining ? daysUntil(displayNextTraining.starts_at) : null;\n  const matchCountdown = displayNextMatch ? daysUntil(displayNextMatch.starts_at) : null;\n  const trainingDate = displayNextTraining ? dateParts(displayNextTraining.starts_at) : null;\n  const matchDate = displayNextMatch ? dateParts(displayNextMatch.starts_at) : null;\n  const trainingPlan = displayNextTraining ? planLines(displayNextTraining) : [];\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const primaryLoading = loading && !initialHomeEvents;' not in text:
              raise SystemExit('No se encontró bloque de métricas de Inicio')

          start = text.index('      <div className="coach-home-grid">')
          end = text.index('        {isStaff ? (<>', start)
          grid = text[start:end]
          grid = grid.replace('{loading ? (', '{primaryLoading ? (', 2)
          grid = grid.replace(') : nextTraining ? (', ') : displayNextTraining ? (', 1)
          grid = grid.replace(') : nextMatch ? (', ') : displayNextMatch ? (', 1)
          grid = grid.replace('nextTraining.title', 'displayNextTraining.title')
          grid = grid.replace('nextTraining.location', 'displayNextTraining.location')
          grid = grid.replace('eventDuration(nextTraining)', 'eventDuration(displayNextTraining)')
          grid = grid.replace('opponentName(nextMatch)', 'opponentName(displayNextMatch)')
          grid = grid.replace('nextMatch.location', 'displayNextMatch.location')
          text = text[:start] + grid + text[end:]
          home.write_text(text)

          competition = Path('react-migration/src/pages/CompetitionPage.jsx')
          text = competition.read_text()
          text = text.replace("        name: String(form.name || '').trim() || row.name,", "        name: canRename ? (String(form.name || '').trim() || row.name) : row.name,", 1)
          text = text.replace("    const ok = window.confirm('¿Reiniciar los datos de todos los rivales? CV Bunyola seguirá calculándose automáticamente a partir de los resultados de Liga.');", "    const ok = window.confirm('¿Reiniciar a cero la clasificación de los rivales? Los nombres actuales se mantendrán y después podrás cambiarlos para preparar una temporada nueva. CV Bunyola seguirá calculándose automáticamente desde sus partidos de Liga.');", 1)
          text = text.replace('No hay equipos que coincidan con la búsqueda.', 'No hay equipos en la clasificación.', 1)
          competition.write_text(text)
          PY
      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/HomePage.jsx react-migration/src/pages/CompetitionPage.jsx
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "Eliminar frame de carga y cerrar permisos de Liga"
          git push origin HEAD:react-vite-migration
