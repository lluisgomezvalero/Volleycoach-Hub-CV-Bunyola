name: Patch gamification home 20260830

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/patch-gamification-home-20260830.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Add weekly missions to player home
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('react-migration/src/pages/HomePage.jsx')
          text = path.read_text()
          import_anchor = "import { useAuth } from '../auth/AuthProvider.jsx';\n"
          import_line = "import PlayerGamificationCard from '../components/PlayerGamificationCard.jsx';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Home import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          grid_anchor = '      <div className="coach-home-grid">\n'
          gamification = '      {!isStaff ? <PlayerGamificationCard /> : null}\n\n'
          if gamification not in text:
              if grid_anchor not in text:
                  raise SystemExit('Home grid anchor not found')
              text = text.replace(grid_anchor, gamification + grid_anchor, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/HomePage.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Mostrar gamificación semanal en Inicio"
          git push origin HEAD:react-vite-migration
