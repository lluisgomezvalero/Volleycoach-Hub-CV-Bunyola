name: Restore simple player wellness

on:
  push:
    branches: [react-vite-migration]
    paths:
      - '.github/workflows/restore-player-simple-wellness.yml'
      - '.github/scripts/restore_player_simple_wellness.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
      - name: Apply player UI patch
        run: python .github/scripts/restore_player_simple_wellness.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/WellnessPage.jsx react-migration/src/pages/WellnessPage.css react-migration/src/pages/HomePage.jsx react-migration/src/pages/HomePageDashboard.css
          git diff --cached --quiet && exit 0
          git commit -m "Recuperar vista simple de bienestar para jugadoras"
          git push origin react-vite-migration