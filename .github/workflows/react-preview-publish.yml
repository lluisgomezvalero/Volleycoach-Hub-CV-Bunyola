name: React preview publish

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - 'react-migration/**'
      - '.github/workflows/react-preview-publish.yml'

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-migration/package.json

      - name: Build React preview
        working-directory: react-migration
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare preview branch from main
        run: |
          rm -rf /tmp/react-preview-dist
          mkdir -p /tmp/react-preview-dist
          cp -R react-migration/dist/. /tmp/react-preview-dist/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B react-preview-publish origin/main

          rm -rf react-preview
          mkdir -p react-preview
          cp -R /tmp/react-preview-dist/. react-preview/
          printf '%s\n' 'React preview generated from react-vite-migration.' > react-preview/.preview-build

          git add react-preview
          if git diff --cached --quiet; then
            echo "Preview already up to date"
            exit 0
          fi

          git commit -m "Publish React migration preview"
          git push origin HEAD:react-preview-publish --force
