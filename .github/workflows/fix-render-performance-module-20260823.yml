name: Fix performance module render

on:
  push:
    paths:
      - '.github/workflows/fix-render-performance-module-20260823.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render performance module on navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text()
          old = '''  } else if (moduleName === "goals") {
    renderWeeklyGoals();
  } else if (moduleName === "planning") {
    renderPlanningViewer();
  }
'''
          new = '''  } else if (moduleName === "goals") {
    renderWeeklyGoals();
  } else if (moduleName === "fitness") {
    renderPerformanceModule();
  } else if (moduleName === "planning") {
    renderPlanningViewer();
  }
'''
          if old not in s:
              raise SystemExit('openModule anchor not found')
          app.write_text(s.replace(old, new, 1))

          index = Path('index.html')
          s = index.read_text()
          old = 'app.js?v=20260816q'
          new = 'app.js?v=20260823performance1'
          if old not in s:
              raise SystemExit('app.js cache anchor not found')
          index.write_text(s.replace(old, new, 1))
          PY

          node --check app.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Render performance module when opened"
          git push

          git rm .github/workflows/fix-render-performance-module-20260823.yml
          git commit -m "Remove one-time performance render workflow"
          git push
