name: Restore pre-i18n runtime
on:
  push:
    branches:
      - perf/restore-pre-i18n-runtime-20260826
    paths:
      - '.github/workflows/restore-pre-i18n-runtime-20260826.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore runtime loader from pre-i18n baseline
        run: |
          git show f3c51850ede567b079852bc6244edf4cd897cdfb:supabase-config.js > supabase-config.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text(encoding='utf-8').replace("window.VOLLEY_ASSET_VERSION = '20260825ux1';","window.VOLLEY_ASSET_VERSION = '20260826baseline1';",1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'supabase-config\.js\?v=[^"\']+', 'supabase-config.js?v=20260826baseline1', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate baseline runtime
        run: |
          set -e
          node --check supabase-config.js
          grep -q "20260826baseline1" supabase-config.js
          grep -q "supabase-config.js?v=20260826baseline1" index.html
          if grep -q "volley-performance-runtime-css" supabase-config.js; then exit 1; fi
          if grep -q "i18n" supabase-config.js; then exit 1; fi
      - name: Commit restored runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/restore-pre-i18n-runtime-20260826.yml
          git add supabase-config.js index.html
          git commit -m "Restore pre-i18n runtime behavior"
          git push
