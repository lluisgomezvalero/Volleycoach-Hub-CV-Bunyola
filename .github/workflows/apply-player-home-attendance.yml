name: Apply player home attendance
on:
  push:
    branches: [react-vite-migration]
    paths:
      - 'scripts/apply_player_home_attendance.py'
      - '.github/workflows/apply-player-home-attendance.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar cambio
        run: python scripts/apply_player_home_attendance.py
      - name: Limpiar automatización temporal
        run: rm -f scripts/apply_player_home_attendance.py .github/workflows/apply-player-home-attendance.yml
      - name: Guardar resultado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregir asistencia de jugadoras en Inicio'
          git push
