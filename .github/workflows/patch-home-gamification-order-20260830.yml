name: Patch home gamification order 20260830
on:
  push:
    branches: [react-vite-migration]
    paths:
      - '.github/scripts/move-gamification-after-events.py'
      - '.github/workflows/patch-home-gamification-order-20260830.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
      - name: Apply patch
        run: python .github/scripts/move-gamification-after-events.py
      - name: Clean temporary patch files
        run: rm -f .github/scripts/move-gamification-after-events.py .github/workflows/patch-home-gamification-order-20260830.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reordenar gamificación después de próximas actividades"
            git push origin HEAD:react-vite-migration
          fi
