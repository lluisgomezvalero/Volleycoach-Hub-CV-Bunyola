name: Fix attendance matrix mobile

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/fix-attendance-matrix-mobile-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0

      - name: Force fixed attendance matrix columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('react-migration/src/pages/TeamAttendancePanel.css')
          text = p.read_text()
          marker = '/* attendance-matrix-fixed-columns-20260827 */'
          if marker not in text:
              text += r'''

/* attendance-matrix-fixed-columns-20260827 */
.team-attendance-matrix{
  width:max-content!important;
  min-width:100%!important;
  table-layout:fixed!important;
}
.team-attendance-matrix thead th:first-child,
.team-attendance-matrix tbody th{
  width:170px!important;
  min-width:170px!important;
  max-width:170px!important;
}
.team-attendance-matrix thead th:not(:first-child),
.team-attendance-matrix tbody td{
  width:88px!important;
  min-width:88px!important;
  max-width:88px!important;
}
@media(max-width:820px){
  .team-attendance-matrix thead th:first-child,
  .team-attendance-matrix tbody th{
    width:150px!important;
    min-width:150px!important;
    max-width:150px!important;
  }
  .team-attendance-matrix thead th:not(:first-child),
  .team-attendance-matrix tbody td{
    width:84px!important;
    min-width:84px!important;
    max-width:84px!important;
  }
}
@media(max-width:470px){
  .team-attendance-matrix thead th:first-child,
  .team-attendance-matrix tbody th{
    width:142px!important;
    min-width:142px!important;
    max-width:142px!important;
  }
  .team-attendance-matrix thead th:not(:first-child),
  .team-attendance-matrix tbody td{
    width:82px!important;
    min-width:82px!important;
    max-width:82px!important;
  }
  .team-attendance-matrix th,
  .team-attendance-matrix td{padding:10px 6px!important}
}
'''
              p.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/TeamAttendancePanel.css
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "Fix mobile attendance session columns"
          git push origin HEAD:react-vite-migration
