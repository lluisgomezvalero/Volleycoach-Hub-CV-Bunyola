name: Wire Spanish Catalan language module

on:
  push:
    branches:
      - feature/i18n-es-ca-20260826
    paths:
      - '.github/workflows/wire-i18n-es-ca-20260826.yml'

permissions:
  contents: write

jobs:
  wire-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add language module to app loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('supabase-config.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace("window.VOLLEY_ASSET_VERSION = '20260825ux1';", "window.VOLLEY_ASSET_VERSION = '20260826i18n1';")
          needle="  'calendar-profile-roster-fixes-20260825.js?v=20260825ux1',\n"
          insert=needle+"  'i18n-es-ca-20260826.js?v=20260826i18n1',\n"
          if "i18n-es-ca-20260826.js" not in text:
              assert needle in text, 'No se encontró el punto de inserción del módulo i18n'
              text=text.replace(needle,insert,1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check i18n-es-ca-20260826.js
          node --check supabase-config.js
          grep -q "i18n-es-ca-20260826.js?v=20260826i18n1" supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260826i18n1'" supabase-config.js
      - name: Commit language wiring and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-i18n-es-ca-20260826.yml
          git add supabase-config.js i18n-es-ca-20260826.js
          git commit -m "Wire Spanish Catalan language selector"
          git push
