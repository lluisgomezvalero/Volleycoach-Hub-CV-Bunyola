name: Patch player session flow 20260901

on:
  push:
    branches: [react-vite-migration]
    paths:
      - 'scripts/patch_player_session_flow_20260901.py'
      - '.github/workflows/patch-player-session-flow-20260901.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Apply player workflow fixes
        run: python scripts/patch_player_session_flow_20260901.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/HomePage.jsx react-migration/src/pages/TrainingPageProfessional.jsx react-migration/src/pages/HomePolish.css react-migration/src/pages/TrainingPolish.css
          git commit -m "Fix player session completion flows"
          git push origin HEAD:react-vite-migration
