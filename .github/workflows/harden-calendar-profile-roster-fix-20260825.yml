name: Harden calendar profile roster fix

on:
  push:
    branches:
      - fix/calendario-perfil-dorsal-20260825
    paths:
      - '.github/workflows/harden-calendar-profile-roster-fix-20260825.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make DOM observers idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('calendar-profile-roster-fixes-20260825.js')
          s=p.read_text(encoding='utf-8')
          old="""function formatCoachOwnLogin(){
          const info=document.getElementById('profile-private-info');
          if(!info)return;
          [...info.children].forEach(item=>{
            const label=String(item.querySelector('label')?.textContent||'');
            if(!/último\\s+inicio|última\\s+conexión|último\\s+acceso/i.test(label))return;
            const span=item.querySelector('span');
            if(span)span.textContent=formatLogin(span.textContent);
          });
        }"""
          new="""function formatCoachOwnLogin(){
          const info=document.getElementById('profile-private-info');
          if(!info)return;
          [...info.children].forEach(item=>{
            const label=String(item.querySelector('label')?.textContent||'');
            if(!/último\\s+inicio|última\\s+conexión|último\\s+acceso/i.test(label))return;
            const span=item.querySelector('span');
            if(!span)return;
            const formatted=formatLogin(span.textContent);
            if(span.textContent!==formatted)span.textContent=formatted;
          });
        }"""
          assert old in s, 'formatCoachOwnLogin anchor not found'
          s=s.replace(old,new)

          old2="""        const span=item.querySelector('span');
                if(span)span.textContent=formatLogin(data.last_login_at);"""
          new2="""        const span=item.querySelector('span');
                if(span){
                  const formatted=formatLogin(data.last_login_at);
                  if(span.textContent!==formatted)span.textContent=formatted;
                }"""
          assert old2 in s, 'refresh login anchor not found'
          s=s.replace(old2,new2)

          start=s.index('function enhanceRosterLogins(){')
          end=s.index('\nfunction scheduleRosterEnhance(){',start)
          replacement="""function enhanceRosterLogins(){
          rosterEnhanceScheduled=false;
          const view=document.getElementById('view-roster');
          if(!view)return;
          if(!isCoach()){
            view.querySelectorAll('.coach-player-last-login').forEach(node=>node.remove());
            return;
          }
          view.querySelectorAll('.player-trading-card').forEach(card=>{
            const player=playerForCard(card);
            const info=card.querySelector('.trading-card-info');
            if(!player||!info)return;
            const linked=Boolean(player.profile_id||player.profileId);
            const raw=player.lastLoginAt||player.last_login_at||null;
            const text=raw?formatLogin(raw):(linked?'Sin accesos registrados':'Sin cuenta vinculada');
            const desired=`<i data-lucide=\"clock-3\"></i><span><strong>Último acceso:</strong> ${text}</span>`;
            let row=info.querySelector('.coach-player-last-login');
            if(!row){
              row=document.createElement('div');
              row.className='coach-player-last-login';
              info.appendChild(row);
            }
            row.classList.toggle('is-empty',!raw);
            if(row.innerHTML!==desired)row.innerHTML=desired;
          });
          try{window.lucide?.createIcons?.();}catch(_){}
        }"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check calendar-profile-roster-fixes-20260825.js
      - name: Commit hardening and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-profile-roster-fixes-20260825.js
          git rm .github/workflows/harden-calendar-profile-roster-fix-20260825.yml
          git commit -m "Harden profile and roster DOM observers"
          git push
