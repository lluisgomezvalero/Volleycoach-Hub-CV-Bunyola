name: Patch player attendance buttons 20260828

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - 'scripts/patch_player_attendance_buttons.py'
      - '.github/workflows/patch-player-attendance-buttons-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0
      - name: Aplicar cambio
        run: python3 scripts/patch_player_attendance_buttons.py
      - name: Limpiar automatización temporal
        run: rm -f scripts/patch_player_attendance_buttons.py .github/workflows/patch-player-attendance-buttons-20260828.yml
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mejorar botones de asistencia de jugadoras"
          git push origin HEAD:react-vite-migration
