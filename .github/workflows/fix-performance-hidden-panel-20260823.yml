name: Fix performance panel visibility

on:
  push:
    paths:
      - '.github/workflows/fix-performance-hidden-panel-20260823.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop attendance from hiding performance view
        run: |
          python - <<'PY'
          from pathlib import Path

          attendance = Path('team-attendance-overview-20260812.js')
          s = attendance.read_text()
          old = "const perf=document.getElementById('training-performance-panel');if(perf) perf.hidden=true;"
          new = "const perf=document.getElementById('training-performance-panel');if(perf&&perf.closest('#view-training')) perf.hidden=true;"
          if old not in s:
              raise SystemExit('attendance performance-hide anchor not found')
          attendance.write_text(s.replace(old, new, 1))

          perf = Path('performance-module-render-fix-20260823.js')
          s = perf.read_text()
          old = """    if(moduleName==='fitness'){\n      requestAnimationFrame(()=>{\n        try{window.renderPerformanceModule();}\n        catch(error){console.error('[VolleyCoach] No se pudo renderizar Rendimiento:',error);}\n      });\n    }"""
          new = """    if(moduleName==='fitness'){\n      requestAnimationFrame(()=>{\n        try{\n          const panel=document.getElementById('training-performance-panel');\n          if(panel)panel.hidden=false;\n          window.renderPerformanceModule();\n        }\n        catch(error){console.error('[VolleyCoach] No se pudo renderizar Rendimiento:',error);}\n      });\n    }"""
          if old not in s:
              raise SystemExit('performance renderer anchor not found')
          perf.write_text(s.replace(old, new, 1))

          config = Path('supabase-config.js')
          s = config.read_text()
          repl = [
              ("window.VOLLEY_ASSET_VERSION = '20260823c';", "window.VOLLEY_ASSET_VERSION = '20260823d';"),
              ("'team-attendance-overview-20260812.js?v=20260812p'", "'team-attendance-overview-20260812.js?v=20260823a'"),
              ("'performance-module-render-fix-20260823.js?v=20260823a'", "'performance-module-render-fix-20260823.js?v=20260823b'"),
          ]
          for old,new in repl:
              if old not in s:
                  raise SystemExit(f'config anchor not found: {old}')
              s=s.replace(old,new,1)
          config.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          old = 'supabase-config.js?v=20260823safe65'
          new = 'supabase-config.js?v=20260823safe66'
          if old not in s:
              raise SystemExit('index cache anchor not found')
          index.write_text(s.replace(old,new,1))
          PY

          node --check team-attendance-overview-20260812.js
          node --check performance-module-render-fix-20260823.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-attendance-overview-20260812.js performance-module-render-fix-20260823.js supabase-config.js index.html
          git commit -m "Keep performance panel visible in fitness"
          git push

          git rm .github/workflows/fix-performance-hidden-panel-20260823.yml
          git commit -m "Remove one-time performance visibility workflow"
          git push
