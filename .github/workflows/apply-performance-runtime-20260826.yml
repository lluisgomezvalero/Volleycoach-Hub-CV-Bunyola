name: Apply performance runtime
on:
  push:
    branches:
      - perf/runtime-loader-20260826
    paths:
      - '.github/workflows/apply-performance-runtime-20260826.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lightweight runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n','')
          marker='    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n'
          insert='    <script src="performance-runtime-20260826.js?v=20260826perf1"></script>\n'
          if insert not in s:
              if marker not in s: raise SystemExit('Supabase marker not found')
              s=s.replace(marker,insert+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check performance-runtime-20260826.js
          grep -q 'performance-runtime-20260826.js?v=20260826perf1' index.html
          if grep -q 'xlsx.full.min.js' index.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-performance-runtime-20260826.yml
          git add index.html performance-runtime-20260826.js
          git commit -m "Reduce mobile rendering overhead"
          git push
