name: React PWA and load monitoring validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-mobile-shell-20260825.yml'
      - 'index.html'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'assets/index-insights-20261012.js'
      - 'assets/load-*'
      - 'tests/load-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployed React PWA modules
        run: |
          node --check assets/index-insights-20261012.js
          node --check assets/load-model-20261015.js
          node --check assets/load-ui-20261015.js
          node --check service-worker.js
          python -m json.tool manifest.webmanifest >/dev/null
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          assert 'viewport-fit=cover' in html
          assert 'rel="manifest"' in html
          assert 'assets/load-20261015.css' in html
          for source in re.findall(r'(?:src|href)="(\./[^"?]+)(?:\?[^" ]*)?"',html):
              assert Path(source).is_file(), source
          assert "request.mode !== 'navigate'" in Path('service-worker.js').read_text()
          PY
      - name: Test load scenarios and screen controls
        run: node --test tests/load-monitoring.test.mjs tests/load-ui.test.mjs
      - name: Check existing app behavior
        run: |
          for file in tests/*.test.cjs; do
            node "$file" || exit 1
          done
