name: Force wellness cache refresh

on:
  push:
    paths:
      - '.github/workflows/force-wellness-cache-20260824.yml'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump config cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('supabase-config.js?v=20260824safe68','supabase-config.js?v=20260824wellness2')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Force fresh wellness config'
            git push
          fi
