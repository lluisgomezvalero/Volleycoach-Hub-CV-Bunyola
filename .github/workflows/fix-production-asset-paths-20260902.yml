name: Fix production asset paths 20260902

on:
  push:
    branches:
      - react-vite-migration
    paths:
      - '.github/workflows/fix-production-asset-paths-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-vite-migration
          fetch-depth: 0

      - name: Fix app-scoped asset paths
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('react-migration/src/pages/HomePage.jsx'): [
                  (
                      "const CLUB_LOGO = `${import.meta.env.BASE_URL}../assets/pwa-icon-192.png?v=20260825pwa4`;",
                      "const CLUB_LOGO = `${import.meta.env.BASE_URL}assets/pwa-icon-192.png?v=20260825pwa4`;",
                  ),
                  (
                      "if (normalized.startsWith('assets/')) return `../${normalized}`;",
                      "if (normalized.startsWith('assets/')) return `${import.meta.env.BASE_URL}${normalized}`;",
                  ),
              ],
              Path('react-migration/src/pages/CompetitionPage.jsx'): [
                  (
                      "return `../${clean}`;",
                      "return `${import.meta.env.BASE_URL}${clean}`;",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected pattern not found in {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)

          # Report any remaining source paths that climb above the app scope.
          suspicious = []
          for path in Path('react-migration/src').rglob('*'):
              if path.suffix not in {'.js', '.jsx', '.css'}:
                  continue
              text = path.read_text(errors='ignore')
              if 'BASE_URL}../assets/' in text:
                  suspicious.append(f'{path}: BASE_URL + ../assets')
          if suspicious:
              raise SystemExit('Remaining suspicious production asset paths:\n' + '\n'.join(suspicious))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-migration/src/pages/HomePage.jsx react-migration/src/pages/CompetitionPage.jsx
          if git diff --cached --quiet; then
            echo "Asset paths already fixed"
            exit 0
          fi
          git commit -m "Fix production logo asset paths"
          git push origin HEAD:react-vite-migration
