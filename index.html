    <link rel="icon" type="image/png" sizes="192x192" href="./assets/pwa-icon-192.png" />
    <title>VolleyCoach Hub · CV Bunyola</title>
    <script>
      (() => {
        const recoveryKey = 'volleycoach-recovery-20260911-v1';
        if (sessionStorage.getItem(recoveryKey)) return;
        sessionStorage.setItem(recoveryKey, 'done');
        const clearWorkers = 'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then((items) => Promise.all(items.map((item) => item.unregister())))
          : Promise.resolve();
        const clearCaches = 'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          : Promise.resolve();
        Promise.allSettled([clearWorkers, clearCaches]).then(() => {
          const url = new URL(window.location.href);
          url.searchParams.set('recovered', '20260911');
          window.location.replace(url.href);
        });
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-restored-20260911.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-restored-20260911.css">
